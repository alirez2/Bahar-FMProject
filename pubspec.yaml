name: poolaki
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.8.0
  provider: ^6.1.2
  fl_chart: ^0.69.0
  intl: ^0.20.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  flutter_localizations:
    sdk: flutter
  persian_datetime_picker: ^3.2.0
  shamsi_date: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_native_splash:
  color: "#003a5c"
  image: assets/images/logo.png